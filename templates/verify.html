{% extends "base.html" %}

{% block content %}
<h2>Verifikasi Integritas Data Voting</h2>

{% if success %}
    <div class="alert success">
        {{ message }}
    </div>
{% else %}
    <div class="alert error">
        {{ message }}
    </div>
{% endif %}

<div class="card">
    <p>
        Verifikasi dilakukan dengan mengecek kesesuaian hash blok, HMAC data suara,
        dan hubungan antarblok dalam hash chain.
    </p>
</div>

{% endblock %}
